<!doctype html>
<html lang="ru">

<head>
    <meta charset="utf-8" />
    <title>VERSTKA</title>
    <link rel="stylesheet" href="styles/bzhola.css" />
    <link rel="stylesheet" href="styles/styles.css" />
    <link rel="stylesheet" href="styles/ilon.css" />
    <link rel="stylesheet" href="styles/logo.css" />
</head>

<body>
    <header class="header">

        <!-- <div class="unicorn">
            <div class="uni mane"></div>
            <div class="uni neck"></div>
            <div class="uni cranium"></div>
            <div class="uni muzzle"></div>
            <div class="uni ear"></div>
            <div class="uni horn"></div>
            <div class="uni eye"></div>

        <div class="unicorn">
            <!-- ухо -->
            <i class="l" style="--x:36;--y:12;--len:18.4;--a:77.5"></i>
            <i class="l" style="--x:36;--y:12;--len:19.8;--a:45"></i>
            <i class="l" style="--x:50;--y:26;--len:8;--a:0"></i>
            <!-- рог -->
            <i class="l horn" style="--x:58;--y:26;--len:34;--a:-49.8"></i>
            <i class="l horn" style="--x:80;--y:0;--len:36;--a:109.4"></i>
            <!-- морда -->
            <i class="l" style="--x:68;--y:34;--len:24;--a:48.4"></i>
            <i class="l" style="--x:84;--y:52;--len:13.4;--a:63.4"></i>
            <i class="l" style="--x:90;--y:64;--len:12.8;--a:141.3"></i>
            <i class="l" style="--x:80;--y:72;--len:15.2;--a:203.2"></i>
            <i class="l" style="--x:66;--y:66;--len:14.1;--a:135"></i>
            <i class="l" style="--x:56;--y:76;--len:22.8;--a:105.3"></i>
            <!-- грива и шея -->
            <i class="l" style="--x:40;--y:30;--len:16.5;--a:166"></i>
            <i class="l" style="--x:24;--y:34;--len:11.7;--a:59"></i>
            <i class="l" style="--x:30;--y:44;--len:17.9;--a:153.4"></i>
            <i class="l" style="--x:14;--y:52;--len:12.8;--a:51.3"></i>
            <i class="l" style="--x:22;--y:62;--len:18.4;--a:139.4"></i>
            <i class="l" style="--x:8;--y:74;--len:15.6;--a:39.8"></i>
            <i class="l" style="--x:20;--y:84;--len:15.2;--a:113.2"></i>
            <!-- глаз и скула -->
            <i class="l" style="--x:62;--y:44;--len:8.5;--a:20.6"></i>
            <!-- <i class="l" style="--x:46;--y:44;--len:20;--a:53.1"></i> -->
        </div>

        <nav class="menu">
            <a href="#">Страница 1</a>
            <a href="#">Страница 2</a>
            <a href="#">Страница 3</a>
        </nav>
    </header>

    <section class="sec">
        <p class="sec__title">Задание 1</p>

        <div class="sec__content art">
            <div class="bzhol">
                <div class="cloud l"></div>
                <div class="cloud r"></div>

                <div class="head">
                    <div class="eye l"></div>
                    <div class="eye r"></div>
                </div>

                <div class="belly"></div>

                <div class="wings">
                    <div class="side l">
                        <div class="wing w2"></div>
                        <div class="wing w1"></div>
                    </div>
                    <div class="side r">
                        <div class="wing w2"></div>
                        <div class="wing w1"></div>
                        <div class="wing w3"></div>
                    </div>
                </div>

                <div class="mushroom leg l"></div>
                <div class="mushroom leg r"></div>
                <div class="mushroom l"></div>
                <div class="mushroom r"></div>

                <div class="grass"></div>
            </div>
        </div>
    </section>

    <section class="sec">
        <p class="sec__title">Задание 2</p>

        <div class="sec__content reel">
            <div class="ilon-wrapper">
                <div class="ilon">
                    <div class="ilon__pair">
                        <img class="ilon__mask3" src="animation/mask3.png" alt="">
                        <img class="ilon__mask2" src="animation/mask2.png" alt="">
                    </div>
                    <div class="on__curs">
                        <img class="mask5" src="animation/mask5.png" alt="">
                        <img class="rocket" src="animation/mask4.png" alt="">
                        <p class="oncurs__text">КАК ТЕБЕ ТАКОЕ?</p>
                    </div>
                    <div class="clicked__mask">
                        <img class="cl__finger" src="animation/finger2.png" alt="">
                        <img class="cl__finger2" src="animation/finger3.png" alt="">
                        <p class="clicked__text">МЕНЯ НЕ УДИВИШЬ</p>
                    </div>
                </div>
            </div>
        </div>
    </section>


</body>

</html>
