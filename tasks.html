<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Задания</title>
    <link rel="icon" href="images/favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="styles/styles.css" />
    <link rel="stylesheet" href="styles/logo.css" />
    <link rel="stylesheet" href="styles/index.css" />
    <link rel="stylesheet" href="styles/bzhola.css" />
    <link rel="stylesheet" href="styles/ilon.css" />
    <link rel="stylesheet" href="dom/dom.css" />
  </head>

  <body>
    <header class="header">
      <a class="logo" href="index.html">
        <span class="logo__icon">
          <span class="logo__cup logo__cup--left"></span>
          <span class="logo__cup logo__cup--right"></span>
        </span>
        <span class="logo__text">ERUSSIA</span>
      </a>

      <nav>
        <a href="index.html" aria-current="page">Главная</a>
        <a href="artists.html">Артисты</a>
        <a href="festivals.html">Фестивали</a>
        <a href="tasks.html">Задания</a>
      </nav>
    </header>

    <main>
      <!-- Герой -->
      <section class="sec sec--hero">
        <div class="sec__content">
          <div class="hero__text">
            <p class="hero__label"></p>
            <h1>ЗАДАНИЯ ПО КУРСУ</h1>
          </div>
        </div>
      </section>

      <section class="sec">
        <h2 class="sec__title">ЗАДАНИЕ 1</h2>
        <div class="sec__content">
          <div class="sec__content art">
            <div class="bzhol">
              <div class="cloud l"></div>
              <div class="cloud r"></div>

              <div class="head">
                <div class="eye l"></div>
                <div class="eye r"></div>
              </div>

              <div class="belly"></div>

              <div class="wings">
                <div class="side l">
                  <div class="wing w2"></div>
                  <div class="wing w1"></div>
                </div>
                <div class="side r">
                  <div class="wing w2"></div>
                  <div class="wing w1"></div>
                </div>
              </div>

              <div class="mushroom leg l"></div>
              <div class="mushroom leg r"></div>
              <div class="mushroom l"></div>
              <div class="mushroom r"></div>

              <div class="grass"></div>
            </div>
          </div>
        </div>
      </section>

      <section class="sec">
        <h2 class="sec__title">ЗАДАНИЕ 2</h2>
        <div class="sec__content">
          <div class="sec__content reel">
            <div class="ilon-wrapper">
              <div class="ilon">
                <div class="ilon__pair">
                  <img class="ilon__mask3" src="animation/mask3.png" alt="" />
                  <img class="ilon__mask2" src="animation/mask2.png" alt="" />
                </div>
                <div class="on__curs">
                  <img class="mask5" src="animation/mask5.png" alt="" />
                  <img class="rocket" src="animation/mask4.png" alt="" />
                  <p class="oncurs__text">КАК ТЕБЕ ТАКОЕ?</p>
                </div>
                <div class="clicked__mask">
                  <img class="cl__finger" src="animation/finger2.png" alt="" />
                  <img class="cl__finger2" src="animation/finger3.png" alt="" />
                  <p class="clicked__text">МЕНЯ НЕ УДИВИШЬ</p>
                </div>
              </div>
            </div>
          </div>
        </div>
      </section>

      <section class="sec">
        <h2 class="sec__title">ЗАДАНИЕ 3</h2>
        <div class="sec__content">
          <div class="page">
            <h1>Знаешь ли ты слэнг?</h1>

            <button class="btn" id="restart" type="button">
              НАЧАТЬ ЗАНОВО
            </button>

            <div id="status" hidden>
              <div>Вопросы закончились</div>
              <div id="stats"></div>
            </div>

            <section id="area" class="area"></section>
          </div>
        </div>
      </section>
    </main>

    <footer class="footer">
      <span class="footer__logo">ERUSSIA</span>
      <ul class="footer__links">
        <li>
          <a href="https://t.me/yyy_yy_kkk"
            ><img
              class="footer__icon"
              src="images/icons/telegram.svg"
              alt="Telegram"
              width="32"
              height="32"
          /></a>
        </li>
        <li>
          <a href="https://vk.ru/yapanterrra"
            ><img
              class="footer__icon"
              src="images/icons/vk.svg"
              alt="ВКонтакте"
              width="32"
              height="32"
          /></a>
        </li>
        <li>
          <a href="mailto:yapanterrra@gmail.com"
            ><img
              class="footer__icon"
              src="images/icons/mail.svg"
              alt="Почта"
              width="32"
              height="32"
          /></a>
        </li>
      </ul>
    </footer>

    <script src="dom/scriptdom.js"></script>
  </body>
</html>
